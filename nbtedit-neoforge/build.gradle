architectury {
    neoForge()
}

loom {
    neoForge {
        convertAccessWideners(tasks.named('shadowJar'), loom.accessWidenerPath.get().asFile.name)
    }

    runs {
        client {
            client()

            runDir 'run/client'

            // To support the Enhanced Class Redefinition in JBR.
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
            vmArg '-XX:+AllowEnhancedClassRedefinition'

            // https://openjdk.org/jeps/400
            property 'file.encoding', 'COMPAT'
        }

        server {
            server()
            runDir 'run/server'
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
            vmArg '-XX:+AllowEnhancedClassRedefinition'
            property 'file.encoding', 'COMPAT'
        }

        clientData {
            clientData()
            runDir 'run/data'
            programArgs '--all', '--mod', 'nbtedit'
            programArgs '--output', file('../nbtedit-common/src/generated/resources').absolutePath
            programArgs '--existing', file('../nbtedit-common/src/main/resources').absolutePath
        }
    }
}

configurations {
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    common(project(':nbtedit-common')) { transitive = false }
    shadowBundle project(path: ':nbtedit-common', configuration: 'transformProductionNeoForge')
}
