import java.time.OffsetDateTime

plugins {
    id 'com.gradleup.shadow' version '9.6.+' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.+'
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT' apply false
}

def ENV = System.getenv()
def isRelease = 'true'.equalsIgnoreCase(ENV.MOD_RELEASE)

var publishVersion = project.mod_version
var mavenVersion = publishVersion
if (!isRelease) {
    mavenVersion += '-SNAPSHOT'
}

ext.publishVersion = publishVersion
ext.mavenVersion = mavenVersion

subprojects {
    apply plugin: 'java'
    apply plugin: 'architectury-plugin'
    apply plugin: 'dev.architectury.loom-no-remap'

    architectury {
        minecraft = project.minecraft_version
    }

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${project.minecraft_version}"

        compileOnly group: 'org.jetbrains', name: 'annotations', version: rootProject.jetbrains_annotations_version

        compileOnly group: 'org.projectlombok', name: 'lombok', version: rootProject.lombok_version
        annotationProcessor group: 'org.projectlombok', name: 'lombok', version: rootProject.lombok_version

        testCompileOnly group: 'org.projectlombok', name: 'lombok', version: rootProject.lombok_version
        testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: rootProject.lombok_version
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.VERSION_25
        targetCompatibility = JavaVersion.VERSION_25
    }

    processResources {
        var resourcesToReplace = ['build_info.properties', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', 'pack.mcmeta', 'fabric.mod.json']
        var replaceTokens = [
                'archives_base_name'                 : rootProject.archives_base_name,
                'mod_id'                             : rootProject.mod_id,
                'mod_name'                           : rootProject.mod_name,
                'mod_full_name'                      : rootProject.mod_full_name,
                'mod_version'                        : rootProject.mod_version,
                'minecraft_version'                  : rootProject.minecraft_version,
                'fabric_loader_version'              : rootProject.fabric_loader_version,
                'fabric_api_version'                 : rootProject.fabric_api_version,
                'mod_menu_version'                   : rootProject.mod_menu_version,
                'forge_version'                      : rootProject.forge_version,
                'neoforge_version'                   : rootProject.neoforge_version,
                'forge_loader_version_range'         : rootProject.forge_loader_version_range,
                'forge_version_range'                : rootProject.forge_version_range,
                'forge_minecraft_version_range'      : rootProject.forge_minecraft_version_range,
                'neoforge_loader_version_range'      : rootProject.neoforge_loader_version_range,
                'neoforge_version_range'             : rootProject.neoforge_version_range,
                'neoforge_minecraft_version_range'   : rootProject.neoforge_minecraft_version_range,
                'fabric_loader_version_range'        : rootProject.fabric_loader_version_range,
                'fabric_api_version_range'           : rootProject.fabric_api_version_range,
                'fabric_permission_api_version_range': rootProject.fabric_permission_api_version_range,
                'fabric_minecraft_version_range'     : rootProject.fabric_minecraft_version_range,
                'build_time'                         : OffsetDateTime.now(),
                'build_version'                      : publishVersion
        ]

        inputs.properties replaceTokens
        filesMatching(resourcesToReplace) {
            expand replaceTokens
        }

        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

allprojects {
    apply plugin: 'maven-publish'

    group = 'cx.rain.mc.nbtedit'
    version = publishVersion

    repositories {
        maven {
            name = 'Mod Menu'
            url = 'https://maven.terraformersmc.com/releases'
        }

        maven {
            name = 'Curse maven'
            url = 'https://cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }

        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases/'
        }

        mavenCentral()
    }

    publishing {
        repositories {
            mavenLocal()

            maven {
                name = 'YuluoMaven'

                def releaseUrl = 'https://maven.yuluo.dev/repository/maven-releases/'
                def snapshotUrl = 'https://maven.yuluo.dev/repository/maven-snapshots/'
                url = isRelease ? releaseUrl : snapshotUrl

                credentials {
                    username ENV.MOD_MAVEN_USER
                    password ENV.MOD_MAVEN_PASS
                }
            }
        }
    }
}

[project(':nbtedit-fabric'), project(':nbtedit-forge'), project(':nbtedit-neoforge')].each { Project p ->
    configure(p) {
        apply plugin: 'com.gradleup.shadow'

        architectury {
            platformSetupLoomIde()
        }

        loom {
            accessWidenerPath = project(':nbtedit-common').loom.accessWidenerPath
        }

        configurations {
            common {
                canBeResolved = true
                canBeConsumed = false
            }
            compileClasspath.extendsFrom common
            runtimeClasspath.extendsFrom common
            shadowBundle {
                canBeResolved = true
                canBeConsumed = false
            }
        }

        jar {
            archiveClassifier = 'dev'
        }

        shadowJar {
            exclude 'architectury.common.json'

            configurations = [project.configurations.shadowBundle]
            archiveClassifier = ''
        }

        sourcesJar {
            def commonSources = project(':nbtedit-common').sourcesJar
            dependsOn commonSources
            from commonSources.archiveFile.map { zipTree(it) }
        }

        publishing {
            publications {
                mavenFabric(MavenPublication) {
                    artifactId = p.name
                    version = mavenVersion
                    artifact shadowJar
                    artifact sourcesJar
                }
            }
        }
    }
}

publishMods {
    changelog = providers.environmentVariable('MOD_CHANGELOG').orElse('')
    type = STABLE
    dryRun = providers.environmentVariable('MOD_PUBLISH_DRY_RUN').isPresent()

    def curseforgeShared = curseforgeOptions {
        accessToken = providers.environmentVariable('MOD_CURSEFORGE_TOKEN')
        projectId = rootProject.curseforge_project_id
        minecraftVersions.addAll(rootProject.game_versions.split(','))
        client = true
        server = true
    }

    def modrinthShared = modrinthOptions {
        accessToken = providers.environmentVariable('MOD_MODRINTH_TOKEN')
        projectId = rootProject.modrinth_project_id
        minecraftVersions.addAll(rootProject.game_versions.split(','))
    }

    def fabricShared = publishOptions {
        file = project(':nbtedit-fabric').shadowJar.archiveFile
        displayName = "NBTEdit Fabric ${rootProject.minecraft_version}-${rootProject.mod_version}"
        version = "${publishVersion}+fabric"
        modLoaders.add('fabric')
    }

    def forgeShared = publishOptions {
        file = project(':nbtedit-forge').shadowJar.archiveFile
        displayName = "NBTEdit Forge ${rootProject.minecraft_version}-${rootProject.mod_version}"
        version = "${publishVersion}+forge"
        modLoaders.add('forge')
    }

    def neoForgeShared = publishOptions {
        file = project(':nbtedit-neoforge').shadowJar.archiveFile
        displayName = "NBTEdit NeoForge ${rootProject.minecraft_version}-${rootProject.mod_version}"
        version = "${publishVersion}+neoforge"
        modLoaders.add('neoforge')
    }

    curseforge('curseforgeFabric') {
        from(curseforgeShared, fabricShared)
        requires('fabric-api')
        optional('luckperms')
    }

    modrinth('modrinthFabric') {
        from(modrinthShared, fabricShared)
        requires('fabric-api')
        optional('luckperms')
        embeds('fabric-permissions-api')
    }

    curseforge('curseforgeForge') {
        from(curseforgeShared, forgeShared)
        optional('luckperms')
    }

    modrinth('modrinthForge') {
        from(modrinthShared, forgeShared)
        optional('luckperms')
    }

    curseforge('curseforgeNeoForge') {
        from(curseforgeShared, neoForgeShared)
        optional('luckperms')
    }

    modrinth('modrinthNeoForge') {
        from(modrinthShared, neoForgeShared)
        optional('luckperms')
    }
}
