architectury {
    fabric()
}

configurations {
    developmentFabric.extendsFrom common
}

loom {
    runs {
        client {
            client()

            runDir 'run/client'

            // To support the Enhanced Class Redefinition in JBR.
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
            vmArg '-XX:+AllowEnhancedClassRedefinition'

            // https://openjdk.org/jeps/400
            property 'file.encoding', 'COMPAT'
        }

        server {
            server()
            runDir 'run/server'
            vmArg '-XX:+IgnoreUnrecognizedVMOptions'
            vmArg '-XX:+AllowEnhancedClassRedefinition'
            property 'file.encoding', 'COMPAT'
        }
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    runtimeOnly "com.terraformersmc:modmenu:${rootProject.mod_menu_version}"

    compileOnly "me.lucko:fabric-permissions-api:${rootProject.fabric_permission_api_version}"
    include "me.lucko:fabric-permissions-api:${rootProject.fabric_permission_api_version}"

    common(project(':nbtedit-common')) { transitive = false }
    shadowBundle project(path: ':nbtedit-common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'build_version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

loom {
    nestJars tasks.named('shadowJar'), project.configurations.include
    injectAccessWidener tasks.named('shadowJar')
}

unifiedPublishing {
    project {
        displayName = "NBTEdit Fabric ${project.minecraft_version}-${project.mod_version}"
        version = "${publishVersion}-fabric"
        gameVersions = rootProject.game_versions.split(',') as List
        gameLoaders = ['fabric']
        releaseType = 'release'

        mainPublication tasks.shadowJar

        relations {
            depends {
                curseforge = 'fabric-api'
                modrinth = 'fabric-api'
            }

            optional {
                curseforge = 'luckperms'
                modrinth = 'luckperms'
            }

            includes {
                modrinth = 'fabric-permissions-api'
            }
        }

        curseforge {
            token = Objects.requireNonNullElse(System.getenv('CURSEFORGE_TOKEN'), "")
            id = '678133'
        }

        modrinth {
            token = Objects.requireNonNullElse(System.getenv('MODRINTH_TOKEN'), "")
            id = 'Vr2eDeCw'
        }
    }
}
